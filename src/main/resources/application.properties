# Dastur nomi
spring.application.name=restapi

# ==========================================
# JPA / Hibernate sozlamalari
# ==========================================
# ddl-auto=update: Entity classlariga qarab avtomatik ravishda bazada jadval (table) yaratadi yoki yangilaydi
spring.jpa.hibernate.ddl-auto=update
# Konsolda bajarilayotgan SQL so'rovlarni ko'rsatish
spring.jpa.show-sql=true
# SQL so'rovlarni chiroyli formatda chiqarish
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# H2 Database sozlamalari (Vaqtinchalik xotira bazasi)
# ==========================================
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console: Brauzer orqali bazadagi jadvallarni vizual ko'rish imkoniyati
# Manzil: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
